  </defs>

  <!-- iFood-style vibrant rounded app squircle -->
  <rect width="512" height="512" rx="128" fill="url(#ifumoBg)" />
  <rect x="18" y="18" width="476" height="476" rx="112" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="6" />

  <!-- Subtle smoke wave at top right -->
  <path d="M366 154C366 128 394 118 394 92C394 70 368 60 368 40" stroke="#FDE68A" stroke-width="14" stroke-linecap="round" opacity="0.85" />
  <path d="M404 166C404 144 426 136 426 114C426 94 404 86 404 68" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.65" />

  <!-- Bold iFood-inspired "iF" delivery typography -->
  <g filter="url(#softShadow)">
    <circle cx="152" cy="134" r="26" fill="#FDE68A" />
    <circle cx="152" cy="134" r="13" fill="#FFFFFF" />
    <rect x="128" y="176" width="48" height="126" rx="24" fill="#FFFFFF" />

    <path d="M212 146C212 132.745 222.745 122 236 122H344C357.255 122 368 132.745 368 146C368 159.255 357.255 170 344 170H262V202H328C341.255 202 352 212.745 352 226C352 239.255 341.255 250 328 250H262V278C262 291.255 251.255 302 238 302C223.641 302 212 290.359 212 276V146Z" fill="#FFFFFF" />
    <rect x="352" y="122" width="32" height="48" rx="14" fill="#FDE68A" />
  </g>

